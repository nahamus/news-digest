# News Digest configuration — the only file you normally edit.

title: News Digest
timezone: America/New_York

lookback_hours: 36        # ignore stories older than this (a feed can override it)
max_per_category: 10      # stories per category
max_per_source: 4         # max stories from one outlet within a category (a category can override it)
show_first: 5             # stories shown per category before "Show more"

# Stories covered by at least this many outlets get pulled into a Top Stories section.
top_stories:
  min_outlets: 3
  max: 5

# Topics you follow: matching stories are highlighted and collected in a "Following"
# section at the top. Whole words/phrases, any case.
follow: [Stock Market, Federal Reserve, Inflation, Interest Rate, Interest Rates, Recession,
         LLM, LLMs, Africa]
follow_max: 12

# Drop any story whose headline or summary contains one of these (whole word, any case).
mute: []

# Drop stories whose *headline* contains one of these. Feeds can add their own `skip` list.
skip_titles: [quiz, crossword, podcast, horoscope, promo code, coupon, coupons,
              best deals, deals on, Black Friday deal, Black Friday deals,
              Cyber Monday deal, Cyber Monday deals]

# Days kept in the archive (one entry per day: that day's last edition).
archive_days: 15

# Open a GitHub issue when a feed fails this many builds in a row (closed when it recovers).
alert_after_failures: 3

# AI briefing: a 2-3 sentence summary at the top of each category, written by Claude.
# Access is keyless (Workload Identity Federation, set up in digest.yml); without it, skipped.
briefing:
  enabled: true
  model: claude-opus-5-5
  effort: low

# Categories in display order. A feed with `filter: true` only keeps items matching the
# category's keywords (whole word, any case), so broad feeds can feed narrow categories.
# Any RSS/Atom feed works, including YouTube channels and Substack newsletters, e.g.
#   - { name: Veritasium, url: "https://www.youtube.com/feeds/videos.xml?channel_id=UCHnyfMqiRRG1u-2MsSQLbXA" }
#   - { name: Noahpinion, url: "https://www.noahpinion.blog/feed" }
# (Reddit blocks automated feed requests, so subreddit feeds don't work here.)
categories:
  - name: Science
    max_per_source: 2
    feeds:
      - { name: ScienceDaily, url: "https://www.sciencedaily.com/rss/all.xml" }
      # Nature dates items by day only, so give it a longer window.
      - { name: Nature, url: "https://www.nature.com/nature.rss", lookback_hours: 72 }
      - { name: Phys.org, url: "https://phys.org/rss-feed/" }
      - { name: Quanta, url: "https://www.quantamagazine.org/feed/" }
      - { name: NASA, url: "https://www.nasa.gov/news-release/feed/", skip: [APOD] }
      - { name: New Scientist, url: "https://www.newscientist.com/feed/home/" }
      - { name: Science News, url: "https://www.sciencenews.org/feed" }

  - name: Tech
    feeds:
      - { name: Ars Technica, url: "https://feeds.arstechnica.com/arstechnica/index" }
      - { name: The Verge, url: "https://www.theverge.com/rss/index.xml" }
      - { name: TechCrunch, url: "https://techcrunch.com/feed/" }
      - { name: Wired, url: "https://www.wired.com/feed/rss" }
      - { name: Hacker News, url: "https://hnrss.org/frontpage?points=150" }

  - name: AI
    keywords: [AI, A.I., artificial intelligence, LLM, LLMs, OpenAI, Anthropic, Claude,
               ChatGPT, GPT, Gemini, DeepMind, Copilot, machine learning, deep learning,
               neural network, neural networks, chatbot, chatbots, generative, Llama, Mistral]
    feeds:
      - { name: MIT Tech Review, url: "https://www.technologyreview.com/topic/artificial-intelligence/feed" }
      - { name: The Verge, url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml" }
      - { name: TechCrunch, url: "https://techcrunch.com/category/artificial-intelligence/feed/" }
      - { name: Hacker News, url: "https://hnrss.org/frontpage?points=100", filter: true }
      - { name: Ars Technica, url: "https://feeds.arstechnica.com/arstechnica/index", filter: true }

  - name: Finance
    feeds:
      - { name: CNBC, url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114" }
      - { name: MarketWatch, url: "https://feeds.content.dowjones.io/public/rss/mw_topstories" }
      - name: Bloomberg
        url: "https://feeds.bloomberg.com/markets/news.rss"
        skip: [Pointed!, This Weekend, Bloomberg Surveillance, Odd Lots, Big Take, Wall Street Week]
      - { name: Yahoo Finance, url: "https://feeds.finance.yahoo.com/rss/2.0/headline?s=^GSPC&region=US&lang=en-US" }

  - name: Politics
    feeds:
      - { name: NPR, url: "https://feeds.npr.org/1014/rss.xml" }
      - { name: Politico, url: "https://rss.politico.com/politics-news.xml" }
      - { name: The Hill, url: "https://thehill.com/news/feed/" }
      - { name: The Guardian, url: "https://www.theguardian.com/us-news/us-politics/rss" }
      - { name: BBC World, url: "https://feeds.bbci.co.uk/news/world/rss.xml" }

  # Ethiopia news moves slower than the other categories, so these feeds look back further.
  # (Addis Standard, The Reporter, Borkena and Capital don't serve usable feeds to bots.)
  - name: Ethiopia
    max_per_source: 6
    keywords: [Ethiopia, Ethiopian, Ethiopians, Addis Ababa, Tigray, Amhara, Oromia, Abiy]
    feeds:
      - { name: AllAfrica, url: "https://allafrica.com/tools/headlines/rdf/ethiopia/headlines.rdf", lookback_hours: 96 }
      - { name: Ethiopia Insight, url: "https://www.ethiopia-insight.com/feed/", lookback_hours: 96 }
      - { name: Addis Fortune, url: "https://addisfortune.news/feed/", lookback_hours: 168 }
      - { name: The Guardian, url: "https://www.theguardian.com/world/ethiopia/rss", lookback_hours: 96 }
      - { name: BBC Africa, url: "https://feeds.bbci.co.uk/news/world/africa/rss.xml", filter: true, lookback_hours: 96 }
      - { name: Al Jazeera, url: "https://www.aljazeera.com/xml/rss/all.xml", filter: true, lookback_hours: 96 }
      # Google News search: wire, international and Ethiopian outlets whose own feeds block
      # bots. Each story is credited to its real outlet; links open through a Google redirect.
      # Only the outlets listed under `publishers` are kept (the search also returns a lot of
      # low-quality sites). Names must match how Google News labels the outlet.
      - name: Google News
        url: "https://news.google.com/rss/search?q=Ethiopia+when:3d&hl=en-US&gl=US&ceid=US:en"
        publisher_from_entry: true
        lookback_hours: 72
        publishers: [Reuters, AP News, Associated Press, AFP, France 24, BBC, BBC News,
                     Al Jazeera, DW.com, Africanews, The EastAfrican, The Africa Report,
                     Addis Standard, Borkena, CapitalEthiopia, The Reporter Ethiopia,
                     Ethiopia Insight, ENA English, Addis Fortune, Sudan Tribune, UN News,
                     ReliefWeb, The Guardian, Bloomberg, Financial Times, The Economist,
                     The New York Times, The Washington Post, Semafor, VOA, Voice of America,
                     Council on Foreign Relations, International Crisis Group]
      # Amharic-language sources, if you want them:
      # - { name: BBC Amharic, url: "https://feeds.bbci.co.uk/amharic/rss.xml", lookback_hours: 96 }
      # - { name: VOA Amharic, url: "https://amharic.voanews.com/api/", lookback_hours: 96 }
