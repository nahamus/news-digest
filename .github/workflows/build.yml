name: Build digest

on:
  schedule:
    - cron: "0 12 * * *"   # 7 AM EST / 8 AM EDT
    - cron: "0 22 * * *"   # 5 PM EST / 6 PM EDT
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.yaml
      - build.py
      - templates/**
      - static/**
      - .github/workflows/build.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Build
        run: python build.py

      - name: Commit seen.json
        run: |
          if [ -n "$(git status --porcelain data/seen.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/seen.json
            git commit -m "Update seen.json [skip ci]"
            # seen.json is only a history cache: on a conflict, keep this build's copy
            git pull --rebase -X theirs
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
