name: Build digest

# Timed builds come from cron-job.org, which calls the workflow_dispatch API at
# 7:17, 12:17 and 17:17 America/New_York. GitHub's own `schedule` trigger never
# fired for this repo (or fresh test repos on this account), so it was removed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.yaml
      - build.py
      - feed_alerts.py
      - requirements.txt
      - tests/**
      - templates/**
      - static/**
      - .github/workflows/digest.yml

permissions:
  contents: write
  actions: read     # deploy-pages lists this run's artifacts
  issues: write     # feed_alerts.py opens/closes feed-health issues
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Test
        run: python -m unittest discover tests

      - name: Build
        env:
          # Optional: the AI briefing runs only when this secret exists.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python build.py

      - name: Commit data (seen, health, archive)
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            # No skip tag: GitHub skips scheduled runs when the latest commit has one.
            # Not needed anyway: pushes made with GITHUB_TOKEN never start workflows.
            git commit -m "Update digest data"
            # data/ is generated: on a conflict, keep this build's copy
            git pull --rebase -X theirs
            git push
          fi

      - name: Feed health alerts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python feed_alerts.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
